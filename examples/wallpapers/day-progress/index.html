<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Day Progress</title>
  <style>
    html {
      background: linear-gradient(160deg, #12141c 0%, #1a1626 55%, #0e1018 100%);
    }

    html, body {
      margin: 0;
      height: 100%;
    }

    body {
      display: grid;
      place-items: center;
      font-family: -apple-system, system-ui, sans-serif;
      color: #eceef4;
    }

    main {
      width: min(52vw, 900px);
    }

    h1 {
      margin: 0 0 0.3em;
      font-size: 3.6vw;
      font-weight: 300;
      letter-spacing: -0.01em;
    }

    .subtitle {
      margin: 0 0 3.2vw;
      font-size: 1.3vw;
      color: #8f95a8;
    }

    .meter {
      margin-bottom: 2.4vw;
    }

    .label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.7vw;
      font-size: 1.15vw;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #9aa1b5;
    }

    .label strong {
      font-weight: 600;
      color: #eceef4;
      letter-spacing: 0.02em;
      font-variant-numeric: tabular-nums;
    }

    .track {
      height: 0.55vw;
      border-radius: 1vw;
      background: rgba(255, 255, 255, 0.07);
      overflow: hidden;
    }

    .fill {
      height: 100%;
      width: 0;
      border-radius: inherit;
      transition: width 1.2s ease;
    }

    .day .fill { background: linear-gradient(90deg, #f5a65b, #f0c87a); }
    .week .fill { background: linear-gradient(90deg, #e86f8e, #f19bb3); }
    .month .fill { background: linear-gradient(90deg, #8d7cf0, #b6a9ff); }
    .year .fill { background: linear-gradient(90deg, #4fb7c9, #8fe0e8); }
  </style>
</head>
<body>
  <main>
    <h1 id="title"></h1>
    <p class="subtitle" id="subtitle"></p>
    <section id="meters"></section>
  </main>
  <script>
    const meters = [
      { key: "day", name: "Today" },
      { key: "week", name: "This week" },
      { key: "month", name: "This month" },
      { key: "year", name: "This year" },
    ];
    const container = document.getElementById("meters");
    for (const meter of meters) {
      const block = document.createElement("div");
      block.className = `meter ${meter.key}`;
      block.innerHTML = `<div class="label"><span>${meter.name}</span><strong></strong></div><div class="track"><div class="fill"></div></div>`;
      container.appendChild(block);
      meter.value = block.querySelector("strong");
      meter.fill = block.querySelector(".fill");
    }

    function fraction(start, end, now) {
      return Math.min(1, Math.max(0, (now - start) / (end - start)));
    }

    function update() {
      const now = new Date();
      const dayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const dayEnd = new Date(dayStart.getFullYear(), dayStart.getMonth(), dayStart.getDate() + 1);
      const weekday = (now.getDay() + 6) % 7;
      const weekStart = new Date(dayStart.getFullYear(), dayStart.getMonth(), dayStart.getDate() - weekday);
      const weekEnd = new Date(weekStart.getFullYear(), weekStart.getMonth(), weekStart.getDate() + 7);
      const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
      const monthEnd = new Date(now.getFullYear(), now.getMonth() + 1, 1);
      const yearStart = new Date(now.getFullYear(), 0, 1);
      const yearEnd = new Date(now.getFullYear() + 1, 0, 1);

      const values = {
        day: fraction(dayStart, dayEnd, now),
        week: fraction(weekStart, weekEnd, now),
        month: fraction(monthStart, monthEnd, now),
        year: fraction(yearStart, yearEnd, now),
      };
      for (const meter of meters) {
        const percent = Math.floor(values[meter.key] * 100);
        meter.value.textContent = `${percent}%`;
        meter.fill.style.width = `${values[meter.key] * 100}%`;
      }

      document.getElementById("title").textContent =
        new Intl.DateTimeFormat(undefined, { weekday: "long", month: "long", day: "numeric" }).format(now);
      const hoursLeft = (dayEnd - now) / 3600000;
      const daysLeft = Math.ceil((yearEnd - dayEnd) / 86400000);
      document.getElementById("subtitle").textContent =
        `${Math.floor(hoursLeft)}h ${Math.floor((hoursLeft % 1) * 60)}m left today · ${daysLeft} days left in ${now.getFullYear()}`;
    }

    update();
    setInterval(update, 30000);
  </script>
</body>
</html>
